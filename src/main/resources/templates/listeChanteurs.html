<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template}">
<head>
    <meta charset="utf-8">
    <title>Liste des Chanteurs</title>
</head>
<div layout:fragment="content">
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">Liste des Chanteurs</div>
            <div class="card-body">
                <table class="table table-striped">
                    <tr>
                        <th>ID</th>
                        <th>Nom Chanteur</th>
                        <th>Cachet</th>
                        <th>Action</th>
                    </tr>
                    <tr th:each="c : ${chanteurs.content}">
                        <td th:text="${c.idChanteur}"></td>
                        <td th:text="${c.nomChanteur}"></td>
                        <td th:text="${c.cachetChanteur}"></td>
                        <td><a class="btn btn-danger" th:href="@{/supprimerChanteur(id=${c.idChanteur}, page=${currentPage}, size=${size})}"
                               onclick="return confirm('Etes-vous sûr?')">Supprimer</a></td>
                    </tr>
                </table>
                <ul class="nav nav-pills">
                    <li th:each="page, status : ${pages}">
                        <a th:class="${status.index == currentPage ? 'btn btn-primary' : 'btn'}"
                           th:href="@{/ListeChanteurs(page=${status.index}, size=${size})}"
                           th:text="${status.index}"></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</html>
