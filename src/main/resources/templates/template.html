<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
  <meta charset="utf-8">
  <title>Gestion des Chanteurs</title>
  <link rel="stylesheet" type="text/css" href="webjars/bootstrap/5.3.3/css/bootstrap.min.css" />
</head>

<body>
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
      <!-- Brand -->
      <a class="navbar-brand" href="#">Gestion des Chanteurs</a>

      <!-- Navbar toggler for mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Links -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/ListeChanteur}">Home</a>
          </li>

          <!-- Dropdown -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbardrop" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
              Chanteur
            </a>
            <div class="dropdown-menu">
              <a class="dropdown-item" th:href="@{/showCreate}">Ajouter</a>
              <a class="dropdown-item" th:href="@{/ListeChanteur}">Lister</a>
            </div>
          </li>
        </ul>

        <ul class="navbar-nav ms-auto">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
              <span sec:authentication="name"></span>
            </a>
            <ul class="dropdown-menu">
              <li><a sec:authorize="!isAuthenticated()" class="dropdown-item" th:href="@{/login}">Login</a></li>
              <li sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="dropdown-item">Logout</button>
                </form>
              </li>
              <li><a class="dropdown-item" href="#">Profile</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Placeholder for page-specific content -->
  <div layout:fragment="content">
    <!-- This will be replaced by the content from pages like login.html -->
  </div>

  <script src="webjars/jquery/3.5.1/jquery.min.js"></script>
  <script src="webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>

</html>
